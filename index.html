<!DOCTYPE html>
<!-- RESCENE 2048 WebGL 페이지: 9:16 세로 화면을 창 크기에 맞춰 가운데에 띄우는 템플릿 (Unity 기본 템플릿 기반) -->
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <!-- interactive-widget=overlays-content: 휴대폰 키보드가 화면 높이를 줄이지 않고 위에 덮이게 한다 (크롬 계열) -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, interactive-widget=overlays-content">
    <meta name="description" content="RESCENE 2048 — 비공식 팬게임입니다">
    <title>RESCENE 2048 · 비공식 팬게임</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #F7F2F5;
        color: #40333B;
        font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      #container {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%; /* 스크립트가 창 높이(px)로 맞춘다 */
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* 9:16 비율을 지키면서 창에 꽉 차게 (주소창이 줄었다 늘었다 하는 모바일은 dvh 기준) */
      #unity-canvas {
        display: block;
        width: min(100vw, calc(100vh * 9 / 16));
        height: min(100vh, calc(100vw * 16 / 9));
        width: min(100vw, calc(100dvh * 9 / 16));
        height: min(100dvh, calc(100vw * 16 / 9));
        background: #F7F2F5;
        outline: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #loading {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        font-size: 18px;
      }
      #progress-empty {
        width: 220px;
        height: 10px;
        border-radius: 5px;
        background: #E0D6DC;
        overflow: hidden;
      }
      #progress-full {
        width: 0%;
        height: 100%;
        background: #40333B;
      }
      #error {
        position: absolute;
        max-width: 80vw;
        padding: 16px;
        background: #FFFFFF;
        border: 2px solid #9E3845;
        display: none;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div>불러오는 중…</div>
        <div id="progress-empty"><div id="progress-full"></div></div>
        <div style="font-size: 13px; opacity: 0.7;">비공식 팬게임입니다</div>
      </div>
      <div id="error"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#container");

      // 9:16 비율로 창에 맞춘다. 닉네임 입력 등으로 휴대폰 키보드가 떠 있는 동안에는
      // 창 높이가 바뀌어도(키보드로 줄거나, 브라우저 도구 막대가 숨어 늘어나도) 게임 화면의 크기와 위치를 그대로 둔다.
      var fitted = false;
      function isTyping() {
        var active = document.activeElement;
        return !!active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA");
      }
      function fitCanvas() {
        if (isTyping() && fitted) return;
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        fitted = true;
        container.style.height = vh + "px";
        canvas.style.width = Math.min(vw, vh * 9 / 16) + "px";
        canvas.style.height = Math.min(vh, vw * 16 / 9) + "px";
      }
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", function () { setTimeout(fitCanvas, 300); });
      document.addEventListener("focusout", function () { setTimeout(fitCanvas, 300); }); // 키보드가 내려가면 다시 맞춘다
      // 브라우저가 입력칸을 보여 주려고 페이지를 스크롤해도 바로 되돌려 게임 화면이 움직이지 않게 한다
      window.addEventListener("scroll", function () {
        if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
      });
      fitCanvas();

      function showError(message) {
        var box = document.querySelector("#error");
        box.textContent = "게임을 불러오지 못했어요. 새로고침해 주세요. (" + message + ")";
        box.style.display = "block";
        document.querySelector("#loading").style.display = "none";
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/de747bca56c232d2123c9179c254c629.data.unityweb",
        frameworkUrl: buildUrl + "/4ed7842b0a5f72dfd4cdadeb6134b195.framework.js.unityweb",
        codeUrl: buildUrl + "/94bd46315778ef0adf910f592838e8fa.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "RESCENE 2048",
        productVersion: "1.0",
        showBanner: function (message, type) {
          if (type === "error") showError(message);
          else console.warn(message);
        },
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/f8adb858327d472a07975a3b10dc5c62.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#progress-full").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
        }).catch(showError);
      };
      script.onerror = function () { showError("loader"); };
      document.body.appendChild(script);
    </script>
  </body>
</html>
